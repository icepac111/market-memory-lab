[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-memory-lab"
version = "0.1.0"
description = "Falsifiable research infrastructure for financial memory and structural change"
requires-python = ">=3.12"
authors = [
  {name = "Pranshu Mihirbhai Jayswal"}
]
readme = "README.md"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
